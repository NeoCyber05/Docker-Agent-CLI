[project]
name = "docker-agent"
version = "0.1.0"
description = "Natural-language CLI for managing Docker infrastructure via an LLM agent. Python rewrite of the TypeScript docker-agent CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "docker-agent contributors" }]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1",
    "docker>=7.1",
    "httpx>=0.27",
    "openai>=1.0",
    "google-generativeai>=0.8",
    "ollama>=0.4",
    "keyring>=25.0",
    "langgraph>=0.2",
    "textual>=0.79",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
docker-agent = "docker_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docker_agent"]

[tool.setuptools.package-dir]
"docker_agent" = "src/docker_agent"

[tool.setuptools.package-data]
"docker_agent" = ["prompts/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E/F = pycodestyle/pyflakes baseline
# I = isort
# UP = pyupgrade
# B = bugbear
# SIM = simplifications
# C4 = comprehensions

[tool.ruff.lint.isort]
known-first-party = ["docker_agent"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# tests use runtime construction patterns mypy can't always prove
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.generativeai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ollama.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "keyring.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.generativeai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ollama"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "keyring"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "docker_agent.components",
    "docker_agent.components.*",
    "docker_agent.screens",
    "docker_agent.screens.*",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "typer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "typer"
ignore_missing_imports = true