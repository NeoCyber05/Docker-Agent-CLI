[project]
name = "docker-agent"
version = "0.1.0"
description = "Natural-language CLI for managing Docker infrastructure via an LLM agent. Python rewrite of the TypeScript docker-agent CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "docker-agent contributors" }]
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7,<3",
    "langchain>=1.3.3,<2",
    "langchain-google-genai>=4,<5",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "openai>=1.0",
    "google-generativeai>=0.8",
    "ollama>=0.4",
    "keyring>=25.0",
    "langgraph>=1.2.5,<1.3",
    "textual>=0.79",
    "typer>=0.12",
    "rich>=13.0",
    "langchain-mcp-adapters>=0.1",
]

[project.optional-dependencies]
docker = ["docker-mcp-server"]

[project.scripts]
infra-agent = "infra_agent.cli:main"
docker-agent = "infra_agent.cli:main"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[tool.uv.sources]
docker-mcp-server = { workspace = true }

[tool.uv.workspace]
members = ["servers/docker-mcp-server"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["infra_agent*"]

[tool.setuptools.package-dir]
"infra_agent" = "src/infra_agent"

[tool.setuptools.package-data]
"infra_agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "servers/docker-mcp-server/tests"]
pythonpath = ["src", "servers/docker-mcp-server/src", "tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E/F = pycodestyle/pyflakes baseline
# I = isort
# UP = pyupgrade
# B = bugbear
# SIM = simplifications
# C4 = comprehensions

[tool.ruff.lint.isort]
known-first-party = ["infra_agent", "docker_mcp_server"]

